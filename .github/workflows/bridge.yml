name: G2 native Bridge
on:
  workflow_call:
    inputs:
      caller_managed_concurrency:
        description: Let the calling CI own cancellation and isolate this run
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
# The caller owns CI cancellation. Standalone dispatches must not cancel its jobs.
concurrency:
  group: bridge-${{ inputs.caller_managed_concurrency && github.run_id || 'manual' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.caller_managed_concurrency }}
jobs:
  native-bridge:
    name: G2 Linux debug and release Bridge
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Native graphics runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa libopenal1 libxi6 libxrandr2 libxinerama1 libxcursor1
      - name: Exact Bridge install and owned debug/release capability smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/project.py verify --suite bridge --output artifacts/g2/bridge
      - name: Read-only exact G2 toolchain and wrapper doctor
        run: python tools/doctor.py --require-g2 --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g2-bridge-${{ github.run_id }}
          path: artifacts/g2/bridge/
          retention-days: 14
