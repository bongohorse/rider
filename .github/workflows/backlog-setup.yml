name: One-time approved Driving Gym backlog setup
on:
  push:
    branches: [setup/s2-issue-plan]
permissions:
  contents: read
  issues: write
concurrency:
  group: one-time-driving-gym-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Create approved milestones and labels, then assign A1–A22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          base = "https://api.github.com/repos/bongohorse/rider"
          assert os.environ["GITHUB_REPOSITORY"] == "bongohorse/rider"
          def api(method, path, data=None):
              req = urllib.request.Request(base + path, data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2026-03-10", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def listing(path):
              result = []
              for page in range(1, 100):
                  batch = api("GET", path + ("&" if "?" in path else "?") + f"per_page=100&page={page}")
                  result += batch
                  if len(batch) < 100:
                      return result
              raise RuntimeError("Unexpected pagination overflow")
          existing = {x["title"]: x for x in listing("/milestones?state=all")}
          names = ["M1 – It drives", "M2 – It is measurable", "M3 – Mobile", "M4 – Stations", "M5 – Lock in"]
          milestones = {}
          for i, title in enumerate(names, 1):
              record = existing.get(title) or api("POST", "/milestones", {"title": title, "description": "Driving Gym approved plan (2026-10-15). Stop at milestone completion for Claudio's drive test and approval before the next milestone."})
              milestones[i] = record["number"]
          labels = {"driving-gym": ("1d76db", "Driving Gym phase A"), "physics": ("5319e7", "Vehicle, terrain or physics measurement"), "mobile": ("0e8a16", "Real Android browser and touch"), "tooling": ("d4c5f9", "Preview, feedback, diagnostics or regression"), "experiment": ("fbca04", "Optional keep/drop experiment")}
          existing_labels = {x["name"] for x in listing("/labels")}
          for name, (color, description) in labels.items():
              if name not in existing_labels:
                  api("POST", "/labels", {"name": name, "color": color, "description": description})
          counts = {i: 0 for i in milestones}
          for a in range(1, 23):
              number = a + 15
              milestone = 1 if a <= 4 else 2 if a <= 12 else 3 if a <= 14 else 4 if a <= 21 else 5
              issue = api("GET", f"/issues/{number}")
              assert issue["title"].startswith(f"[A{a}] "), (number, issue["title"])
              desired = {"driving-gym"}
              if a in [1,2,3,6,7,15,16,17,18,19,20,21,22]: desired.add("physics")
              if a in [13,14]: desired.add("mobile")
              if a in [4,5,8,9,10,11,12,22]: desired.add("tooling")
              if a == 14: desired.add("experiment")
              desired |= {x["name"] for x in issue["labels"]}
              updated = api("PATCH", f"/issues/{number}", {"milestone": milestones[milestone], "labels": sorted(desired)})
              assert updated["milestone"]["number"] == milestones[milestone]
              assert desired <= {x["name"] for x in updated["labels"]}
              counts[milestone] += 1
              print(f"A{a} #{number}: M{milestone}, labels verified")
          assert list(counts.values()) == [4,8,2,7,1], counts
          print(json.dumps({"status":"PASS", "milestones":milestones, "issue_counts":counts, "issues":22, "labels":sorted(labels)}))
          PYTHON
