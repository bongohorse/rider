name: G2 tooling
on:
  workflow_call:
    inputs:
      caller_managed_concurrency:
        description: Let the calling CI own cancellation and isolate this run
        type: boolean
        default: false
      run_negative:
        description: Run isolated broken-build regression from caller CI
        type: boolean
        default: true
  workflow_dispatch:
permissions:
  contents: read
# The caller owns CI cancellation. Standalone dispatches must not cancel its jobs.
concurrency:
  group: g2-${{ inputs.caller_managed_concurrency && github.run_id || 'manual' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.caller_managed_concurrency }}
jobs:
  negative-build:
    name: G2 build-error regression and verified Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Reject injected Lua error and rebuild restored isolated source
        if: ${{ !inputs.caller_managed_concurrency || inputs.run_negative }}
        run: python tools/g2/negative_build.py --output artifacts/g2/negative-build
      - name: Build debug APK through shared CLI
        run: python tools/project.py build --target android --configuration debug --output artifacts/g2/android
      - name: Verify APK signature and parse manifest
        run: python tools/g2/inspect_apk.py artifacts/g2/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g2-negative-build-${{ github.run_id }}
          path: artifacts/g2/
          retention-days: 14
