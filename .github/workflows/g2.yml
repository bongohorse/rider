name: G2 tooling
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  negative-build:
    name: G2 isolated build-error regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Reject injected Lua error and rebuild restored isolated source
        run: python tools/g2/negative_build.py --output artifacts/g2/negative-build
      - name: Build debug APK through shared CLI
        run: python tools/project.py build --target android --configuration debug --output artifacts/g2/android
      - name: Verify APK signature and parse manifest
        run: python tools/g2/inspect_apk.py artifacts/g2/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g2-negative-build-${{ github.run_id }}
          path: artifacts/g2/
          retention-days: 14
