name: G1 physics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: G1 native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: windows-2025
            platform: x86_64-win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - name: Build exact backend engine
        run: python tools/g1/build.py --platform ${{ matrix.platform }} --output artifacts/g1/native
      - name: Probe runtime backend
        run: python tools/g1/backend_probe.py artifacts/g1/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/g1/
          retention-days: 14
  html5:
    name: G1 HTML5
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - name: Build HTML5 candidate
        run: python tools/g1/build.py --platform wasm-web --output artifacts/g1/html5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-html5-${{ github.run_id }}
          path: artifacts/g1/
          retention-days: 14
