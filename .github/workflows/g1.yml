name: G1 physics
on:
  workflow_call:
    inputs:
      caller_managed_concurrency:
        description: Let the calling CI own cancellation and isolate this run
        type: boolean
        default: false
      cold_browser_cache:
        description: Validate empty browser cache and missing-library recovery in struts
        type: boolean
        default: false
      run_windows_native:
        description: Include Windows native physics in a called CI matrix
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      cold_browser_cache:
        description: Validate empty browser cache and missing-library recovery in struts
        type: boolean
        default: false
permissions:
  contents: read
# The caller owns CI cancellation. Standalone dispatches must not cancel its jobs.
concurrency:
  group: g1-${{ inputs.caller_managed_concurrency && github.run_id || 'manual' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.caller_managed_concurrency }}
jobs:
  native:
    name: G1 native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: x86_64-linux
            configuration: headless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Verified Windows software OpenGL
        if: runner.os == 'Windows'
        run: python tools/g2/setup_windows_graphics.py
      - run: python -m unittest discover -s tests/g1 -v
      - name: Build exact backend engine
        run: python tools/project.py verify --suite physics --target desktop --configuration ${{ matrix.configuration }} --output artifacts/g1/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/g1/
          retention-days: 14
  native-windows:
    name: G1 native (windows-2025)
    if: ${{ !inputs.caller_managed_concurrency || inputs.run_windows_native }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Verified Windows software OpenGL
        if: runner.os == 'Windows'
        run: python tools/g2/setup_windows_graphics.py
      - run: python -m unittest discover -s tests/g1 -v
      - name: Build exact backend engine
        run: python tools/project.py verify --suite physics --target desktop --configuration debug --output artifacts/g1/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-x86_64-win32-${{ github.run_id }}
          path: artifacts/g1/
          retention-days: 14
  html5:
    name: G1 HTML5
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache pinned Playwright Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium and validate runner dependencies
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: node tools/ci/setup_playwright.cjs artifacts/g1/playwright-setup
      - name: Build and run HTML5 physics
        run: python tools/project.py verify --suite physics --target html5 --output artifacts/g1/html5
      - name: Verify per-case engine startup injection
        run: node --test tests/ci/*.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-html5-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/g1/
          retention-days: 14
  gym-build:
    name: Build shared debug Gym
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Build shared debug Gym bundle
        run: python tools/gym/bundle.py --output artifacts/g1/gym-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gym-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/g1/gym-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  gym:
    name: Gym (${{ matrix.group }})
    needs: gym-build
    strategy:
      fail-fast: false
      matrix:
        include:
          # a18, le1b, a19b and le6 run in two independent parts; gym-reports validates full inventories.
          - group: seams-1
            cases: 'a18'
            part: '1/2'
          - group: seams-2
            cases: 'a18'
            part: '2/2'
          - group: sizes-1
            cases: 'le1b'
            part: '1/2'
          - group: sizes-2
            cases: 'le1b'
            part: '2/2'
          - group: ramps
            cases: 'a16'
          - group: steps
            cases: 'a17'
          - group: gaps
            cases: 'a19'
          - group: balance
            cases: 'a19d'
          - group: bumps-1
            cases: 'a19b'
            part: '1/2'
          - group: bumps-2
            cases: 'a19b'
            part: '2/2'
          - group: air
            cases: 'a19c'
          - group: editor
            cases: 'a15 le1a le2'
          - group: draw
            cases: 'le3'
          - group: library
            cases: 'le4'
          - group: prefab
            cases: 'le5a'
          - group: curve
            cases: 'le5b'
          - group: path
            cases: 'le5c'
          - group: pause
            cases: 'a20'
          - group: points
            cases: 'le5d'
          - group: objects
            cases: 'ea2'
          - group: versions
            cases: 'ea3'
          - group: polish-1
            cases: 'le6'
            part: '1/2'
          - group: polish-2
            cases: 'le6'
            part: '2/2'
          - group: struts
            cases: 'cf3'
          - group: replay
            cases: 'a21'
          - group: regress
            cases: 'a22'
          - group: controls
            cases: 'a3 a6 coast coast345 a15a hud a7 a8 m2feedback a9 a9invalid a10 a11 a12'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache pinned Playwright Chromium
        id: browser-cache
        if: ${{ !(inputs.cold_browser_cache && matrix.group == 'struts') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('package-lock.json') }}
      - name: Select empty browser cache for clean-download validation
        if: ${{ inputs.cold_browser_cache && matrix.group == 'struts' }}
        shell: bash
        run: |
          test ! -e "$RUNNER_TEMP/rider-playwright-cold"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/rider-playwright-cold" >> "$GITHUB_ENV"
      - name: Exercise missing-system-library recovery on the isolated CI runner
        if: ${{ inputs.cold_browser_cache && matrix.group == 'struts' }}
        shell: bash
        run: |
          sudo apt-get remove --yes libxcomposite1
          test ! -e /usr/lib/x86_64-linux-gnu/libXcomposite.so.1
      - name: Install pinned Chromium and validate runner dependencies
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
          RIDER_PLAYWRIGHT_FALLBACK_FIXTURE: ${{ inputs.cold_browser_cache && matrix.group == 'struts' && 'libxcomposite1' || '' }}
        run: node tools/ci/setup_playwright.cjs artifacts/g1/playwright-setup
      - name: Require the clean-cache missing-library fallback evidence
        if: ${{ inputs.cold_browser_cache && matrix.group == 'struts' }}
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const report = require('./artifacts/g1/playwright-setup/setup.json');
          assert.equal(report.status, 'PASS');
          assert.equal(report.fallback, true);
          assert.equal(report.dependency_fixture, 'libxcomposite1');
          JS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gym-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/g1/gym-bundle/
      - name: Verify station speed start, retry, switching and invalid data
        if: contains(format(' {0} ', matrix.cases), ' a15 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/stations --case a15
      - name: Verify custom level import, switching, persistence and recovery
        if: contains(format(' {0} ', matrix.cases), ' le1a ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/custom --case le1a
      - name: Measure custom level size, frame, physics and world-switch cost
        if: contains(format(' {0} ', matrix.cases), ' le1b ')
        env:
          PART: ${{ matrix.part }}
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/sizes --case le1b --part "$PART"
      - name: Verify the level editor shell and Edit/Play loop
        if: contains(format(' {0} ', matrix.cases), ' le2 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/editor --case le2
      - name: Verify editor drawing, connections, snapping and budget
        if: contains(format(' {0} ', matrix.cases), ' le3 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/draw --case le3
      - name: Verify editor level list, export/import, copy/paste and compatibility
        if: contains(format(' {0} ', matrix.cases), ' le4 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/library --case le4
      - name: Verify editor prefabs, parameters, Mirror and prefab budgets
        if: contains(format(' {0} ', matrix.cases), ' le5a ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/prefab --case le5a
      - name: Verify editor curves, Bump/wave, adaptive sampling and the smooth-hill reference drive
        if: contains(format(' {0} ', matrix.cases), ' le5b ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/curve --case le5b
      - name: Verify editor corner/smooth points and prefab conversion to paths
        if: contains(format(' {0} ', matrix.cases), ' le5c ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/path --case le5c
      - name: Verify pause and slow motion against engine and wall time at every station
        if: contains(format(' {0} ', matrix.cases), ' a20 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/pause --case a20
      - name: Measure FPS356 real Defold fixed-tick baseline
        if: contains(format(' {0} ', matrix.cases), ' a20 ')
        run: node tools/gym/fps356.cjs artifacts/g1/fps356 "$GITHUB_SHA" "fps356-${{ github.run_id }}-${{ github.run_attempt }}" fps356 artifacts/g1/gym-bundle
      - name: Verify editor multi-point selection, bulk corner/smooth and prefab conversion
        if: contains(format(' {0} ', matrix.cases), ' le5d ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/points --case le5d
      - name: Verify editor object list, naming, visibility and lock protection
        if: contains(format(' {0} ', matrix.cases), ' ea2 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/objects --case ea2
      - name: Verify editor version restore, backup, failure and storage limits
        if: contains(format(' {0} ', matrix.cases), ' ea3 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/versions --case ea3
      - name: Verify LE6 editor UI and gameplay authoring (independent part)
        if: contains(format(' {0} ', matrix.cases), ' le6 ')
        env:
          PART: ${{ matrix.part }}
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/polish --case le6 --part "$PART"
      - name: Verify visual suspension struts against the bodies, toggle and identical reports
        if: contains(format(' {0} ', matrix.cases), ' cf3 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/struts --case cf3
      - name: Verify record and replay with a ghost on another preset, tick policy and pause/slow motion
        if: contains(format(' {0} ', matrix.cases), ' a21 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/replay --case a21
      - name: Replay the regression traces (jump distance, top speed, air) against frozen tolerances; perturbed runs must fail
        if: contains(format(' {0} ', matrix.cases), ' a22 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/regress --case a22
      - name: Measure ramp ladders and neutral downhill starts
        if: contains(format(' {0} ', matrix.cases), ' a16 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/ramps --case a16
      - name: Measure step ladders and repeatable compression
        if: contains(format(' {0} ', matrix.cases), ' a17 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/steps --case a17
      - name: Measure 20 seams with validated speed windows and retries
        if: contains(format(' {0} ', matrix.cases), ' a18 ')
        env:
          PART: ${{ matrix.part }}
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/seams --case a18 --part "$PART"
      - name: Measure gap ladder, landing variants and jump repeatability
        if: contains(format(' {0} ', matrix.cases), ' a19 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/gaps --case a19
      - name: Drive the balance station (skill trace and replay, full throttle, seesaw tip/settle and retries)
        if: contains(format(' {0} ', matrix.cases), ' a19d ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/balance --case a19d
      - name: Measure bump ladder, crest-dip, crest lift-off speed and reproduced station geometry
        if: contains(format(' {0} ', matrix.cases), ' a19b ')
        env:
          PART: ${{ matrix.part }}
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/bumps --case a19b --part "$PART"
      - name: Measure air control jumps (airtime, rotation, landing angle), repeats and retry
        if: contains(format(' {0} ', matrix.cases), ' a19c ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/air --case a19c
      - name: Build and run current Gym smoke
        if: contains(format(' {0} ', matrix.cases), ' a3 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/gym --case a3
      - name: Verify reverse and airborne lean through normal commands
        if: contains(format(' {0} ', matrix.cases), ' a6 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/feel --case a6
      - name: Coasting and brake-tap regression
        if: contains(format(' {0} ', matrix.cases), ' coast ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/coast --case coast
      - name: Measure stock-A 5 m/s grounded coast twice and full brake on real fixed Gym ticks
        if: contains(format(' {0} ', matrix.cases), ' coast345 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/coast-measure --case coast345
      - name: Verify bounded visual rider reaction
        if: contains(format(' {0} ', matrix.cases), ' a15a ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/rider --case a15a
      - name: Verify injected HUD FPS colour thresholds
        if: contains(format(' {0} ', matrix.cases), ' hud ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/hud --case hud
      - name: Verify head sensor and both crash switches
        if: contains(format(' {0} ', matrix.cases), ' a7 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/head --case a7
      - name: Verify live slider and captured input
        if: contains(format(' {0} ', matrix.cases), ' a8 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/sliders --case a8
      - name: Verify expanded feel controls and grounded keyboard lean
        if: contains(format(' {0} ', matrix.cases), ' m2feedback ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/feedback-feel --case m2feedback
      - name: Verify URL presets and every registered preset drivable
        if: contains(format(' {0} ', matrix.cases), ' a9 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/presets --case a9
      - name: Verify invalid URL fallback
        if: contains(format(' {0} ', matrix.cases), ' a9invalid ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/preset-invalid --case a9invalid
      - name: Verify engine audio activation and wheel pitch
        if: contains(format(' {0} ', matrix.cases), ' a10 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/audio --case a10
      - name: Verify feedback clipboard and visible permission failure
        if: contains(format(' {0} ', matrix.cases), ' a11 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/feedback --case a11
      - name: Verify five-second history and physical stop spike
        if: contains(format(' {0} ', matrix.cases), ' a12 ')
        run: python tools/gym/smoke.py --bundle artifacts/g1/gym-bundle --output artifacts/g1/history --case a12
      - name: Keep Gym screenshot separately for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.group == 'controls' }}
        with:
          name: gym-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/g1/gym/gym.png
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-gym-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/g1/*/
            !artifacts/g1/gym-bundle/
          retention-days: 14
  gym-reports:
    name: Merge Gym part reports
    needs: gym
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: g1-gym-*-[12]-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/parts/
      - name: Merge seam parts into the full A18 report
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python tools/gym/smoke.py --case a18 --output artifacts/g1/seams --merge "artifacts/parts/g1-gym-seams-1-$RUN/seams" "artifacts/parts/g1-gym-seams-2-$RUN/seams"
      - name: Merge size parts into the full LE1b report
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python tools/gym/smoke.py --case le1b --output artifacts/g1/sizes --merge "artifacts/parts/g1-gym-sizes-1-$RUN/sizes" "artifacts/parts/g1-gym-sizes-2-$RUN/sizes"
      - name: Merge bump parts into the full A19b report
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python tools/gym/smoke.py --case a19b --output artifacts/g1/bumps --merge "artifacts/parts/g1-gym-bumps-1-$RUN/bumps" "artifacts/parts/g1-gym-bumps-2-$RUN/bumps"
      - name: Validate and merge both LE6 parts into all 23 editor cases
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python tools/gym/smoke.py --case le6 --output artifacts/g1/polish --merge "artifacts/parts/g1-gym-polish-1-$RUN/polish" "artifacts/parts/g1-gym-polish-2-$RUN/polish"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g1-gym-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/g1/
          retention-days: 14
