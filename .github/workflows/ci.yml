name: CI
on:
  push:
    branches: [main, setup/g0-bootstrap]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_browser_cache:
        description: Validate empty Chromium cache in the struts group only
        type: boolean
        required: false
        default: false
      full_run:
        description: Force the complete regression suite (manual runs are always full)
        type: boolean
        required: false
        default: true
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, unconditional full suite
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      skip_special: ${{ steps.classify.outputs.skip_special }}
      selection_reason: ${{ steps.classify.outputs.selection_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cache SHA-verified actionlint archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci/actionlint.tar.gz
          key: actionlint-archive-v1-${{ hashFiles('tools/ci/actionlint-lock.json') }}
      - name: Lint workflow syntax and expressions
        run: python3 tools/ci/lint_workflows.py
      - name: Check fast-path classification rules
        run: python3 -m unittest discover -s tests/ci -v
      - name: Detect Markdown-only change (fail closed)
        id: classify
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) {
              echo "docs_only=false"
              echo "skip_special=false"
              echo "selection_reason=scheduled-or-manual-full"
            } >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            {
              echo "docs_only=false"
              echo "skip_special=false"
              echo "selection_reason=missing-base-full"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$BASE^{commit}"
          git diff --no-renames --name-only -z "$BASE" HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 tools/ci/classify_changes.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
      - name: Explain CI selection
        if: always()
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          SKIP_SPECIAL: ${{ steps.classify.outputs.skip_special }}
          REASON: ${{ steps.classify.outputs.selection_reason }}
        shell: bash
        run: |
          {
            echo "### CI selection"
            echo "- Reason: $REASON"
            echo "- Docs-only: $DOCS_ONLY"
            echo "- Windows/Bridge/negative-build skipped: $SKIP_SPECIAL"
            echo "- Linux native, HTML5 and Android stay selected for gameplay."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate changed Markdown relative links
        if: steps.classify.outputs.docs_only == 'true'
        run: python3 tools/ci/check_docs_links.py "$RUNNER_TEMP/changed-paths"
  bootstrap:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m unittest discover -s tests/g2 -v
      - name: Linux unified verification
        if: runner.os == 'Linux'
        run: bash tools/verify.sh --suite bootstrap --output artifacts/g2/bootstrap
      - name: Windows unified verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/verify.ps1 --suite bootstrap --output artifacts/g2/bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g2-cli-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/g2/
          retention-days: 14
      - name: Linux doctor wrapper
        if: runner.os == 'Linux'
        run: bash tools/doctor.sh --json
      - name: Windows doctor wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/doctor.ps1 --json
  renovate:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Renovate validation and scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run renovate:validate
      - name: Real dependency extraction scan
        env:
          LOG_LEVEL: debug
          LOG_FILE: artifacts/renovate-debug.ndjson
          LOG_FILE_LEVEL: debug
        run: |
          mkdir -p artifacts
          npm run renovate:scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-scan-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
  physics:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/g1.yml
    with:
      caller_managed_concurrency: true
      run_windows_native: ${{ needs.changes.outputs.skip_special != 'true' }}
      cold_browser_cache: ${{ inputs.cold_browser_cache || false }}
  tooling:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/g2.yml
    with:
      caller_managed_concurrency: true
      run_negative: ${{ needs.changes.outputs.skip_special != 'true' }}
  bridge:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.skip_special != 'true'
    uses: ./.github/workflows/bridge.yml
    with:
      caller_managed_concurrency: true
  preview:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/preview.yml
  pages:
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true' && needs.required.result == 'success'
    needs: [changes, required]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
  required:
    name: required
    if: ${{ always() }}
    needs: [changes, bootstrap, renovate, physics, tooling, bridge, preview]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify strict selected-job outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/required_gate.py
  nightly_alert:
    name: Nightly full-suite issue alert
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: required
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create/update one tooling issue on failure; close on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: python3 tools/ci/nightly_alert.py
