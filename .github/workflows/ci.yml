name: CI
on:
  push:
    branches: [main, setup/g0-bootstrap]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cache SHA-verified actionlint archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci/actionlint.tar.gz
          key: actionlint-archive-v1-${{ hashFiles('tools/ci/actionlint-lock.json') }}
      - name: Lint workflow syntax and expressions
        run: python3 tools/ci/lint_workflows.py
      - name: Check fast-path classification rules
        run: python3 -m unittest discover -s tests/ci -v
      - name: Detect Markdown-only change (fail closed)
        id: classify
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$BASE^{commit}"
          git diff --no-renames --name-only -z "$BASE" HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 tools/ci/classify_changes.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
      - name: Validate changed Markdown relative links
        if: steps.classify.outputs.docs_only == 'true'
        run: python3 tools/ci/check_docs_links.py "$RUNNER_TEMP/changed-paths"
  bootstrap:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m unittest discover -s tests/g2 -v
      - name: Linux unified verification
        if: runner.os == 'Linux'
        run: bash tools/verify.sh --suite bootstrap --output artifacts/g2/bootstrap
      - name: Windows unified verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/verify.ps1 --suite bootstrap --output artifacts/g2/bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g2-cli-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/g2/
          retention-days: 14
      - name: Linux doctor wrapper
        if: runner.os == 'Linux'
        run: bash tools/doctor.sh --json
      - name: Windows doctor wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/doctor.ps1 --json
  renovate:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Renovate validation and scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run renovate:validate
      - name: Real dependency extraction scan
        env:
          LOG_LEVEL: debug
          LOG_FILE: artifacts/renovate-debug.ndjson
          LOG_FILE_LEVEL: debug
        run: |
          mkdir -p artifacts
          npm run renovate:scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-scan-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
  physics:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/g1.yml
    with:
      caller_managed_concurrency: true
  tooling:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/g2.yml
    with:
      caller_managed_concurrency: true
  bridge:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/bridge.yml
    with:
      caller_managed_concurrency: true
  preview:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/preview.yml
  pages:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true'
    needs: [changes, required]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
  required:
    name: required
    if: ${{ always() }}
    needs: [changes, bootstrap, renovate, physics, tooling, bridge, preview]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if results.get('changes', {}).get('result') != 'success':
              sys.exit('Change classification failed; required refuses to pass')
          docs_only = results['changes'].get('outputs', {}).get('docs_only') == 'true'
          expected = 'skipped' if docs_only else 'success'
          checked = {name: job for name, job in results.items() if name != 'changes'}
          if len(checked) != 6 or any(job['result'] != expected for job in checked.values()):
              sys.exit(f"Unexpected CI dependencies; expected all {expected}")
          print(f"required PASS ({'docs-only fast path' if docs_only else 'complete regression suite'})")
          PYTHON
