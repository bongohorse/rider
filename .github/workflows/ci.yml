name: CI
on:
  push:
    branches: [main, setup/g0-bootstrap]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/bootstrap_check.py
      - run: python -m unittest discover -s tests/bootstrap -v
      - name: Linux doctor wrapper
        if: runner.os == 'Linux'
        run: bash tools/doctor.sh --json
      - name: Windows doctor wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/doctor.ps1 --json
  renovate:
    name: Renovate validation and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run renovate:validate
      - name: Real dependency extraction scan
        env:
          LOG_LEVEL: debug
          LOG_FILE: artifacts/renovate-debug.ndjson
          LOG_FILE_LEVEL: debug
        run: |
          mkdir -p artifacts
          npm run renovate:scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-scan-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
