name: Preview release bundle
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify screen-aware tilt mapping and normalization
        run: node --test tests/mobile/tilt.test.cjs
      - name: Build release gym without native Bridge dependency
        run: python tools/project.py build --target html5 --configuration release --fixture gym --output artifacts/preview/bundle
      - name: Package exact source with unique asset paths
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/preview/package.py --bundle artifacts/preview/bundle --output _site --sha "$SOURCE_SHA" --build-id "$BUILD_ID"
      - name: Verify release loader and gym on desktop and phone viewport
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/preview/verify.cjs _site "$SOURCE_SHA" "$BUILD_ID" artifacts/preview/verification
      - name: Upload deployable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-evidence-${{ github.run_id }}
          path: |
            artifacts/preview/verification/
            artifacts/preview/bundle/*.log
            artifacts/preview/bundle/*.json
            artifacts/preview/bundle/extender/
          retention-days: 14
