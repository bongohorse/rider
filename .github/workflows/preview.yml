name: Preview release bundle
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Cache verified Bob download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Build release gym without native Bridge dependency
        run: python tools/project.py build --target html5 --configuration release --fixture gym --output artifacts/preview/bundle
      - name: Package exact source with unique asset paths
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/preview/package.py --bundle artifacts/preview/bundle --output _site --sha "$SOURCE_SHA" --build-id "$BUILD_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload deployable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/preview/bundle/*.log
            artifacts/preview/bundle/*.json
            artifacts/preview/bundle/extender/
          retention-days: 14
  verify:
    name: Release (${{ matrix.group }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [desktop-layout, desktop-gameplay, phone, touch, stations]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache pinned Playwright Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium and validate runner dependencies
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: node tools/ci/setup_playwright.cjs artifacts/preview/verification/playwright-setup
      - name: Verify screen-aware tilt mapping and normalization
        run: node --test tests/mobile/tilt.test.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
      - name: Validate release verification plan and timing observer
        if: matrix.group == 'desktop-layout'
        run: node --test tests/preview/verification-plan.test.cjs tests/preview/timings.test.cjs
      - name: Verify release loader and gym on desktop and phone viewport
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/preview/verify.cjs _site "$SOURCE_SHA" "$BUILD_ID" artifacts/preview/verification/${{ matrix.group }} ${{ matrix.group }}
      - name: Exercise public-deployment check against the packaged release
        if: matrix.group == 'desktop-layout'
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/preview/verify.cjs _site "$SOURCE_SHA" "$BUILD_ID" artifacts/preview/verification/deployment deployment
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-verification-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview/verification/
          retention-days: 14

  verify-gate:
    name: Release verification artifact and coverage gate
    needs: [build, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: preview-verification-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview/gate/
      - name: Reject missing, duplicate, failed or mismatched release evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 tools/preview/verify_artifacts.py artifacts/preview/gate "$SOURCE_SHA" "$BUILD_ID"
