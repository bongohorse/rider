name: Parallax experiment 545
on:
  pull_request:
    paths:
      - 'main/parallax545/**'
      - 'tools/parallax545/**'
      - '.github/workflows/parallax545.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallax545-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    name: Parallax desktop feasibility
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/g1/bob.jar
          key: bob-v1-${{ hashFiles('tools/toolchain-lock.json') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('package-lock.json') }}
      - name: Validate pinned Chromium and runner libraries
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: node tools/ci/setup_playwright.cjs artifacts/parallax545/browser
      - name: Build isolated fixture with engine guards
        run: python tools/parallax545/build.py --output artifacts/parallax545/build
      - name: Measure complete matrix
        run: node tools/parallax545/measure.cjs artifacts/parallax545/build artifacts/parallax545/measurement
      - name: Validate evidence and screen total frame budget
        run: python tools/parallax545/analyze.py artifacts/parallax545/measurement
      - name: Preserve raw evidence even on budget failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parallax545-${{ github.run_id }}
          path: |
            artifacts/parallax545/measurement/
            artifacts/parallax545/browser/
            artifacts/parallax545/build/engines.json
            artifacts/parallax545/build/toolchain.json
            artifacts/parallax545/build/experiment.settings
            artifacts/parallax545/build/bundle.json
            artifacts/parallax545/build/build.log
            artifacts/parallax545/build/extender/
          retention-days: 14
