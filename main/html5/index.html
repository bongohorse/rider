<!doctype html>
<!-- Loader interface derived from Defold 1.14.0 builtins/manifests/web/engine_template.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rider · Driving Gym</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101b20;color:#dceee6;font:14px system-ui}
#app-container,#canvas-container{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
#canvas{display:block;width:100%;height:100%;padding:0;border:0;outline:none;touch-action:none}
#page-tools{position:absolute;right:max(8px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:6px}
body.rider-editing #page-tools{bottom:max(24px,env(safe-area-inset-bottom))}
#page-tools button{font:inherit;font-size:12px;background:#18313bdd;color:#dceee6;border:1px solid #68cdbc;border-radius:5px;padding:5px 8px;min-height:32px}
.canvas-app-progress{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#18313b}
.canvas-app-progress-bar{height:100%;background:#68cdbc;transform-origin:left}
.warning{position:absolute;inset:20%;background:#18313b;padding:20px}
</style>
</head>
<body>
<div id="app-container">
  <div id="canvas-container"><canvas id="canvas" tabindex="0" width="{{display.width}}" height="{{display.height}}"></canvas></div>
  <div id="running-from-file-warning" class="warning" style="display:none">Please open Rider through a web server.</div>
  <div id="webgl-not-supported" class="warning" style="display:none">WebGL is unavailable in this browser.</div>
  <div id="page-tools"><button id="quality" type="button">Quality</button><button id="fullscreen" type="button">Fullscreen</button></div>
</div>
<script id="engine-loader" src="dmloader.js"></script>
<script id="engine-quality">
// #440: Quality High/Low is the High DPI switch (High = High DPI on), remembered for this
// browser origin under a Rider-namespaced key. ?dpi=0|1 overrides it for tests and leaves the
// stored choice alone. A missing, invalid or unreadable value uses the default: High, as
// game.project display.high_dpi = 1. Resolved here, before the engine creates its canvas.
window.riderQuality=(()=>{
  const key='rider-quality-v1';
  const resolve=(search,stored)=>{
    const dpi=new URLSearchParams(search).get('dpi');
    if(dpi==='0'||dpi==='1')return {highDpi:dpi==='1',source:'url'};
    if(stored==='high'||stored==='low')return {highDpi:stored==='high',source:'stored'};
    return {highDpi:true,source:'default'};
  };
  let stored=null;
  try{stored=localStorage.getItem(key);}catch{}
  const {highDpi,source}=resolve(location.search,stored);
  return {key,resolve,highDpi,source,label:'Quality: '+(highDpi?'High':'Low'),
    // Store the other choice and reload without ?dpi so it applies. Without writable
    // storage, fall back to the previous reload with ?dpi for this session.
    toggle(){
      const value=highDpi?'low':'high',url=new URL(location.href);
      let saved=false;
      try{localStorage.setItem(key,value);saved=localStorage.getItem(key)===value;}catch{}
      if(saved)url.searchParams.delete('dpi');else url.searchParams.set('dpi',highDpi?'0':'1');
      if(url.href===location.href)location.reload();else location.href=url.href;
    }};
})();
</script>
<script id="engine-setup">
// #399: dmloader's preSync treats an exhausted initial IndexedDB->memory restore like success.
// The engine would then start on an empty FS and its first sync would delete every stored save.
// Watch the restore result; on final failure keep this session off IndexedDB (no write-back)
// and let custom.js report 'failed', so every save module stays blocked.
(() => {
  const preSync = Module.preSync;
  let failed = false, watching = false;
  Module.preSync = function (done) {
    if (watching || Module.persistentStorage !== true || typeof FS === 'undefined') return preSync.call(this, done);
    watching = true;
    const syncfs = FS.syncfs;
    FS.syncfs = function (populate, callback) {
      return syncfs.call(this, populate, function (err) { if (populate === true) failed = !!err; callback(err); });
    };
    return preSync.call(this, function () {
      FS.syncfs = syncfs;
      if (failed) {
        Module.persistentStorage = false;
        window.riderStorageRestoreFailed = true;
        console.warn('Rider: saved data could not be restored; this session will not write saves.');
      }
      if (done) done();
    });
  };
})();
(() => {
  const highDpi=window.riderQuality.highDpi;
  const quality=document.getElementById('quality');
  quality.textContent=window.riderQuality.label;
  quality.onclick=()=>window.riderQuality.toggle();
  CUSTOM_PARAMETERS.engine_arguments.push('--config=display.high_dpi='+(highDpi?'1':'0'));
  CUSTOM_PARAMETERS.full_screen_container='#app-container';
  document.getElementById('fullscreen').onclick=()=>Module.toggleFullscreen();
  // Stretch the viewport, not the projection. The Auto Fit camera keeps world proportions.
  // Unlike the stock callback, invalidate on DPR changes too (zoom / moving monitors).
  CUSTOM_PARAMETERS.resize_window_callback=()=>{
    const canvas=document.getElementById('canvas');
    const width=innerWidth,height=innerHeight,dpr=highDpi?(devicePixelRatio||1):1;
    const w=Math.max(1,Math.floor(width*dpr)),h=Math.max(1,Math.floor(height*dpr));
    if(canvas.width!==w)canvas.width=w;
    if(canvas.height!==h)canvas.height=h;
    window.riderViewport={width,height,dpr,highDpi,bufferWidth:w,bufferHeight:h};
  };
  // ResizeObserver covers fullscreen; resolution media queries cover browser zoom / DPR.
  new ResizeObserver(()=>CUSTOM_PARAMETERS.resize_window_callback()).observe(document.documentElement);
  function watchDpr(){
    const query=matchMedia('(resolution: '+devicePixelRatio+'dppx)');
    query.addEventListener('change',()=>{CUSTOM_PARAMETERS.resize_window_callback();watchDpr();},{once:true});
  }
  watchDpr();
  CUSTOM_PARAMETERS.resize_window_callback();
})();
</script>
<script id="engine-start">
if(location.protocol==='file:')document.getElementById('running-from-file-warning').style.display='block';
else EngineLoader.load('canvas','{{exe-name}}');
</script>
</body>
</html>
